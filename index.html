    <title>TEXTUP! - Asistente de Escritura IA</title>
    <script>
      // Suprimir errors de WebSocket de Vite/HMR que són esperats en aquest entorn
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
            return;
          }
          originalError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            (event.reason.message && event.reason.message.includes('WebSocket')) ||
            (event.reason.toString && event.reason.toString().includes('WebSocket'))
          )) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
